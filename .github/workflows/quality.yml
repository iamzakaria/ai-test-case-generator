name: Repository quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: ruff check . && ruff format --check .
      - run: python -m pytest --junitxml=artifacts/junit.xml --cov=ai_test_generator --cov-report=xml:artifacts/coverage.xml --cov-fail-under=70
      - run: docker build -t ai-test-case-generator:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: artifacts/
          retention-days: 7
