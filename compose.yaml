services:
  generator:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      FREELLMAPI_API_KEY: ${FREELLMAPI_API_KEY:-}
      FREELLMAPI_BASE_URL: ${FREELLMAPI_BASE_URL:-http://host.docker.internal:31415/v1}
      FREELLMAPI_MODEL: ${FREELLMAPI_MODEL:-auto}
