[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-case-generator"
version = "0.1.0"
description = "Software Quality Engineering Portfolio — ai-test-case-generator"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "httpx>=0.27,<1", "pytest-playwright>=0.7,<1", "allure-pytest>=2.13,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_test_generator = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --alluredir=artifacts/allure-results --clean-alluredir --output=artifacts/playwright --tracing=retain-on-failure --screenshot=only-on-failure"
markers = ["ui: real browser journeys", "integration: service integration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
